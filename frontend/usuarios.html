<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios y Roles</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <div class="page-head">
                <h2 class="page-title">Usuarios y Roles</h2>
                <button type="button" class="btn btn-primary" id="btn-nuevo-usuario">
                    Nuevo usuario
                </button>
            </div>

            <p class="hint">Administra las cuentas y los roles habilitados para cada persona.</p>
            <div id="mensaje-usuarios" aria-live="polite"></div>

            <div class="toolbar">
                <input type="search" id="buscar-usuario" class="search"
                       placeholder="Buscar por nombre, código o correo..."
                       aria-label="Buscar usuarios">
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombres</th>
                            <th>Correo</th>
                            <th>Roles</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/mock-solicitudes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
