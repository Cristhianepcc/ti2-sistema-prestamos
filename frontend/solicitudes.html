<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja de Solicitudes</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <h2 class="page-title">Bandeja de Solicitudes</h2>
            <p class="nota-futura">
                Solicitudes pendientes que corresponden a tus roles. Las decisiones quedan guardadas en el sistema.
            </p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Recurso</th><th>Solicitante</th><th>Tipo</th><th>Estado</th><th></th></tr>
                    </thead>
                    <tbody id="solicitudes"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/solicitudes.js"></script>
</body>
</html>
