<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Custodio</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <h2 class="page-title">Panel Custodio — Entregas</h2>

            <div class="custodio-grid">
                <div class="form-card">
                    <form id="form-registrar-prestamo">
                        <label class="field">Recurso disponible
                            <select name="recurso_id" id="select-recurso" required>
                                <option value="">Seleccione un recurso...</option>
                            </select>
                        </label>

                        <label class="field">ID del prestatario
                            <input type="number" name="prestatario_id" placeholder="Ej. ID numérico" required>
                        </label>

                        <label class="field">Tipo de préstamo
                            <span class="chip-toggle" data-chip-grupo="tipo_prestamo">
                                <span class="chip-opt on" data-valor="SIMPLE">SIMPLE</span>
                                <span class="chip-opt" data-valor="POR_CURSO">POR_CURSO</span>
                                <span class="chip-opt" data-valor="EXCEPCIONAL">EXCEPCIONAL</span>
                            </span>
                            <input type="hidden" name="tipo_prestamo" value="SIMPLE">
                            <span class="hint">Recursos académicos usan POR_CURSO/EXCEPCIONAL; libros y deportivos, SIMPLE.</span>
                        </label>

                        <label class="field">Modalidad de uso
                            <span class="chip-toggle" data-chip-grupo="modalidad_uso">
                                <span class="chip-opt" data-valor="EN_SITIO">EN_SITIO</span>
                                <span class="chip-opt on" data-valor="RETIRO_TEMPORAL">RETIRO_TEMPORAL</span>
                            </span>
                            <input type="hidden" name="modalidad_uso" value="RETIRO_TEMPORAL">
                        </label>

                        <label class="field">Condición de entrega
                            <input type="text" name="condicion_entrega" placeholder="Estado físico inicial" required>
                        </label>

                        <hr>
                        <span class="seccion-titulo">Garantía (opcional)</span>
                        <div class="fila-doble">
                            <input type="text" name="garantia_tipo" list="opciones-garantia" placeholder="Tipo (ej. CARNET, DNI)">
                            <input type="number" name="garantia_valor" value="0" placeholder="Valor" style="max-width:100px;">
                        </div>
                        <datalist id="opciones-garantia">
                            <option value="CARNET">
                            <option value="DNI">
                        </datalist>

                        <div class="alert-danger form-error-msg" hidden role="alert"></div>
                        <button type="submit" class="btn btn-success btn-block">Registrar préstamo / entrega</button>
                    </form>
                </div>

                <div>
                    <div class="toolbar">
                        <input type="text" id="buscar-activos" class="search" placeholder="Buscar por recurso o prestatario...">
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>Recurso</th><th>Prestatario</th><th>Entregado</th><th>Vence</th><th>Estado</th><th></th></tr>
                            </thead>
                            <tbody id="lista-prestamos-activos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/mock-solicitudes.js"></script>
    <script src="js/registrar-prestamo.js"></script>
</body>
</html>
