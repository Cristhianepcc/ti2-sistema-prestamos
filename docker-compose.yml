services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos
      POSTGRES_DB: prestamos
    ports:
      # host -> contenedor 5432. Default 5433 (evita choque con Postgres local en 5432).
      # Sobrescribible: DB_HOST_PORT=5555 docker compose up
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://prestamos:prestamos@db:5432/prestamos
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080"
    ports:
      # Sobrescribible: API_HOST_PORT=8010 docker compose up
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app   # hot-reload en desarrollo

volumes:
  pgdata:
