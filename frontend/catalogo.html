<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <style>
        .catalogo-scroll {
            height: calc(100vh - 70px);
            overflow-y: auto;
        }
        .imagen-fondo {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body class="overflow-hidden">

    <!-- BARRA SUPERIOR -->
    <nav class="navbar navbar-light bg-light px-4 shadow-sm border-bottom" style="height: 70px;">
        <div class="d-flex gap-2">
            <button class="btn btn-outline-dark">☰ Menú</button>
            <a href="mis-prestamos.html" class="btn btn-outline-secondary">Mis Préstamos</a>
            <a href="mis-reservas.html" class="btn btn-outline-secondary">Mis Reservas</a>
            <a href="registrar-prestamo.html" id="link-panel-custodio" class="btn btn-outline-secondary" hidden>Panel Custodio</a>
            <button class="btn btn-outline-secondary">Perfil</button>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary">Notificaciones</button>
            <button id="btn-cerrar-sesion" class="btn btn-danger">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="row g-0">

            <!-- MITAD IZQUIERDA: CATÁLOGO -->
            <div class="col-lg-6 col-12 p-4 catalogo-scroll">

                <div class="mb-4">
                    <input type="text" id="input-buscador" class="form-control rounded-pill px-4 py-2 shadow-sm"
                        placeholder="🔍 Buscar libros, implementos...">
                </div>

                <h3 class="mb-3">Catálogo de Recursos</h3>

                <div id="catalogo"></div>

                <div class="mt-5 mb-4">
                    <hr>
                    <p class="text-muted">¿No encuentras lo que buscas?</p>
                    <a href="solicitud_especial.html" class="btn btn-warning text-dark fw-bold w-100 rounded-pill py-2 shadow-sm">
                        ¿Deseas hacer una solicitud especial?
                    </a>
                </div>
            </div>

            <!-- MITAD DERECHA: IMAGEN -->
            <div class="col-lg-6 d-none d-lg-block">
                <img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?q=80&w=2070&auto=format&fit=crop"
                    alt="Biblioteca" class="imagen-fondo">
            </div>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
