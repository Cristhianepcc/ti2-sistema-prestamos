<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Préstamos</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-login">

    <div class="login-split">
        <div class="login-hero">
            <div class="marca">Sistema de Préstamos</div>
            <h2>Bienvenido de vuelta</h2>
            <p>Catálogo de libros, implementos deportivos y académicos de la Escuela. Solicita, reserva y gestiona tus préstamos desde un solo lugar.</p>
        </div>
        <div class="login-form">
            <h3 class="page-title">Iniciar sesión</h3>

            <div id="error-alert" class="alert-danger" hidden role="alert"></div>

            <form id="login-form">
                <label class="field">Correo institucional
                    <input type="email" id="email" required placeholder="usuario@unsa.edu.pe">
                </label>
                <label class="field">Contraseña
                    <input type="password" id="password" required>
                </label>
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>
            <p class="hint">¿No tienes cuenta? Las credenciales las crea Dirección de Escuela.</p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
