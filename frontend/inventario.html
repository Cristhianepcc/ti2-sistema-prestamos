<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <div class="page-head">
                <h2 class="page-title">Inventario</h2>
                <button type="button" class="btn btn-primary" id="btn-nuevo">Nuevo recurso</button>
            </div>

            <p class="hint" id="resumen"></p>

            <div class="toolbar">
                <input type="text" id="buscar" class="search" placeholder="Buscar por nombre o código...">
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Ubicación</th><th>Estado</th></tr>
                    </thead>
                    <tbody id="inventario"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/mock-solicitudes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/inventario.js"></script>
</body>
</html>
