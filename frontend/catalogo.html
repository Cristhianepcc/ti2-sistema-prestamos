<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Préstamos</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <h2 class="page-title">Catálogo de Recursos</h2>

            <div class="alert-success" id="aviso-exito" hidden style="margin-bottom: 14px;"></div>

            <div class="toolbar">
                <input type="text" id="input-buscador" class="search" placeholder="Buscar libros, implementos...">
                <div class="filters" id="filtros-tipo">
                    <span class="filter on" data-tipo="">Todos</span>
                    <span class="filter" data-tipo="LIBRO">Libros</span>
                    <span class="filter" data-tipo="DEPORTIVO">Deportivo</span>
                    <span class="filter" data-tipo="ACADEMICO">Académico</span>
                </div>
            </div>

            <div id="catalogo" class="cards"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-reservar" hidden>
        <div class="modal">
            <h3 class="page-title" style="margin-bottom: 4px;">Reservar</h3>
            <p class="modal-sub" id="modal-recurso-nombre"></p>

            <form id="form-modal-reservar">
                <label class="field">Fecha
                    <input type="date" name="fecha" required>
                </label>
                <div class="form-fila" style="margin-top: 10px;">
                    <label class="field">Desde
                        <input type="time" name="hora_inicio" required>
                    </label>
                    <label class="field">Hasta
                        <input type="time" name="hora_fin" required>
                    </label>
                </div>
                <div class="alert-danger form-error-msg" hidden style="margin-top: 10px;"></div>
                <div class="acciones">
                    <button type="button" class="btn btn-ghost btn-sm" id="btn-cerrar-modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary btn-sm">Confirmar reserva</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
