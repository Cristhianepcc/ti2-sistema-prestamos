<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Custodio</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <h2 class="page-title">Panel Custodio — Entregas</h2>

            <div class="custodio-grid">
                <div class="form-card">
                    <h3>Registrar una entrega</h3>
                    <p class="hint">Los préstamos se crean al aceptar una solicitud. Así queda guardado quién pidió el recurso y quién autorizó la entrega.</p>
                    <a href="solicitudes.html" class="btn btn-primary btn-block">Abrir bandeja de solicitudes</a>
                </div>

                <div>
                    <div class="toolbar">
                        <input type="text" id="buscar-activos" class="search" placeholder="Buscar por recurso o prestatario...">
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>Recurso</th><th>Prestatario</th><th>Entregado</th><th>Vence</th><th>Estado</th><th></th></tr>
                            </thead>
                            <tbody id="lista-prestamos-activos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/registrar-prestamo.js"></script>
</body>
</html>
