<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Préstamos</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <h2 class="page-title">Catálogo de Recursos</h2>

            <div class="toolbar">
                <input type="text" id="input-buscador" class="search" placeholder="Buscar libros, implementos...">
                <div class="filters" id="filtros-tipo">
                    <span class="filter on" data-tipo="">Todos</span>
                    <span class="filter" data-tipo="LIBRO">Libros</span>
                    <span class="filter" data-tipo="DEPORTIVO">Deportivo</span>
                    <span class="filter" data-tipo="ACADEMICO">Académico</span>
                </div>
            </div>

            <div id="catalogo"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
