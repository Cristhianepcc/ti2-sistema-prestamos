<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Préstamos — EPCC UNSA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand brand">📚 Sistema de Préstamos — EPCC</span>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-3">Iniciar sesión</h1>
            <p class="text-muted small">Plantilla base — el login se implementa en el issue #13.</p>

            <!-- Prueba de conexión con la API (esqueleto Sprint 0) -->
            <button id="btn-health" class="btn btn-outline-primary w-100">Probar conexión con la API</button>
            <div id="health-result" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script>
    document.getElementById("btn-health").addEventListener("click", async () => {
      const box = document.getElementById("health-result");
      showLoading(box);
      try {
        const data = await api.get("/health", { auth: false });
        box.innerHTML = `<div class="alert alert-success mb-0">API OK: ${JSON.stringify(data)}</div>`;
      } catch (e) {
        showError(box, "No se pudo conectar con la API. ¿Está corriendo en :8000?");
      }
    });
  </script>
</body>
</html>
